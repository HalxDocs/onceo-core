name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        go-version: ["1.21", "1.22", "1.23"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Test with race detector
        run: go test ./... -race -coverprofile=coverage.txt -covermode=atomic -count=1 -timeout=120s

      - name: Check coverage
        run: |
          go tool cover -func=coverage.txt | tail -1 | awk '{print $NF}' | sed 's/%//' | awk '{if ($1 < 85) {print "Coverage " $1 "% < 85%"; exit 1}}'

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.txt
          flags: unittests
